name: Evaluate

# Scores the language-model planner and the keyword rules on eval/questions.json and publishes
# eval/results/latest.json and the README table, which the live dashboard also shows.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC
  push:
    branches: [main]
    paths:
      - "src/main/java/com/example/finance/ask/**"
      - "eval/questions.json"

permissions:
  contents: write

concurrency:
  group: evaluate
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-20b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q -DskipTests package
      - name: Run evaluation
        run: |
          [ -n "$LLM_API_KEY" ] || echo "::warning::LLM_API_KEY secret not set; scoring the keyword rules only"
          java -cp target/financial-analysis.jar com.example.finance.eval.PlannerEval
      - name: Commit results
        if: env.LLM_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results README.md
          git diff --cached --quiet || git commit -m "eval: refresh results"
          git push
